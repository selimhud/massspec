<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 22px 14px 22px;
    gap: 10px;
  }

  header { flex-shrink: 0; }
  .title-line {
    display: flex; justify-content: space-between; align-items: center;
    gap: 18px; padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 22px; letter-spacing: -0.01em; line-height: 1.1;
  }
  h1 em { font-style: italic; color: var(--accent-2); font-weight: 300; }
  .meta-inline {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    color: var(--muted); display: flex; gap: 18px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .meta-inline span { color: var(--ink); margin-left: 4px; }
  .header-controls { display: flex; gap: 6px; }

  button {
    background: transparent; color: var(--ink); border: 1px solid var(--line);
    padding: 5px 10px; font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;

  }
  button:hover { border-color: var(--accent-2); color: var(--accent-2); }

  .hint {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--muted); padding: 4px 0 0 0;
  }

  .main {
    flex: 1; display: grid;
    grid-template-columns: 1fr 320px;
    gap: 14px; min-height: 0;
  }

  .chart-shell {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px;
    position: relative; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .chart-shell svg {
    display: block; width: 100%; height: 100%; max-height: 100%;
  }

  .legend-col { display: flex; flex-direction: column; min-height: 0; }
  .legend-header {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;
    padding: 0 4px 8px 4px;
  }
  .legend-grid {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 1px;
    background: var(--line); border: 1px solid var(--line);
    border-radius: 6px;
  }
  .legend-grid::-webkit-scrollbar { width: 6px; }
  .legend-grid::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .legend-grid::-webkit-scrollbar-track { background: transparent; }

  .peak-row {
    background: var(--panel); padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.15s;
  }
  .peak-row:hover { background: #182030; }
  .peak-row .rank {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: #0a0e15; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; flex-shrink: 0; border: 1px solid #0a0e15;
  }
  .peak-row .vals {
    font-family: 'JetBrains Mono', monospace; line-height: 1.4;
    flex: 1; min-width: 0;
  }
  .peak-row .top-line {
    display: flex; gap: 6px; align-items: baseline;
    font-size: 11.5px; color: var(--ink); font-weight: 500;
  }
  .peak-row .delta { color: var(--accent-2); font-size: 10px; }
  .peak-row .assign {
    color: var(--muted); font-size: 10.5px; margin-top: 1px;
    font-family: 'Inter', sans-serif; font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* SVG inner styles */
  .peak-marker { cursor: pointer; }
  .axis text {
    font-family: 'JetBrains Mono', monospace;
    fill: var(--muted); font-size: 11px;
  }
  .axis line, .axis path { stroke: var(--line); stroke-width: 1; }
  .grid line { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 4; }
  .axis-label {
    font-family: 'Inter', sans-serif; font-size: 11px;
    fill: var(--muted); text-transform: uppercase; letter-spacing: 0.15em;
  }
  .zoom-rect { fill: rgba(255, 168, 38, 0.1); stroke: var(--accent-2);

  .tooltip {
    position: absolute; background: #050810; border: 1px solid var(--accent-2);
    color: var(--ink); padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    pointer-events: none; opacity: 0; transition: opacity 0.1s;
    border-radius: 3px; z-index: 10; max-width: 320px;
  }
  .tooltip .t-rank { font-weight: 700; letter-spacing: 0.05em; }
  .tooltip .t-mz { color: var(--ink); margin-top: 4px; }
  .tooltip .t-int, .tooltip .t-delta { color: var(--muted); }
  .tooltip .t-delta { color: var(--accent-2); }
  .tooltip .t-assign {

    border-top: 1px solid var(--line); font-family: 'Inter', sans-serif;
    font-style: italic; white-space: normal;
  }
</style>

  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

const ranked = [...DATA.peaks].sort((a, b) => b.intensity - a.intensity);
ranked.forEach((p, i) => p.rank = i + 1);

const palette = ['#ff5e57', '#ff9f43', '#feca57', '#1dd1a1',
                 '#48dbfb', '#54a0ff', '#5f27cd', '#a55eea', '#778ca3'];
function rankColor(rank) { return palette[rank - 1]; }

document.getElementById('meta-base').textContent =
    DATA.ref_mz.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' Da';

let xDomain = [...DATA.mz_range_default];
const yDomain = [0, DATA.max_intensity * 1.05];

function xScale(v) { return M.left + (v - xDomain[0]) / (xDomain[1] - xDomain[0]) * W; }
function yScale(v) { return M.top + H - (v / (yDomain[1] - yDomain[0])) * H; }

function render() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  svg.appendChild(el('rect', {
    x: M.left, y: M.top, width: W, height: H,
    fill: '#0a0e15', stroke: 'none'
  }));

  const defs = el('defs');
  const grad = el('linearGradient', { id: 'trace-grad', x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(el('stop', { offset: '0%', 'stop-color': '#58a6ff', 'stop-opacity': 0.35 }));
  grad.appendChild(el('stop', { offset: '100%', 'stop-color': '#58a6ff', 'stop-opacity': 0.02 }));
  defs.appendChild(grad);
  svg.appendChild(defs);

  const yTicks = niceTicks(yDomain[0], yDomain[1], 5);
  const yGrid = el('g', { class: 'grid' });
  yTicks.forEach(t => yGrid.appendChild(el('line', {
    x1: M.left, x2: M.left + W, y1: yScale(t), y2: yScale(t)
  })));
  svg.appendChild(yGrid);

  const xTicks = niceTicks(xDomain[0], xDomain[1], 8);
  const xAxis = el('g', { class: 'axis' });
  xAxis.appendChild(el('line', { x1: M.left, x2: M.left + W, y1: M.top + H, y2: M.top + H }));
  xTicks.forEach(t => {
    const x = xScale(t);
    if (x < M.left - 1 || x > M.left + W + 1) return;
    xAxis.appendChild(el('line', { x1: x, x2: x, y1: M.top + H, y2: M.top + H + 5 }));
    xAxis.appendChild(el('text', { x, y: M.top + H + 18, 'text-anchor': 'middle' }, formatNum(t)));
  });
  svg.appendChild(xAxis);

  const yAxis = el('g', { class: 'axis' });
  yAxis.appendChild(el('line', { x1: M.left, x2: M.left, y1: M.top, y2: M.top + H }));
  yTicks.forEach(t => {
    yAxis.appendChild(el('line', { x1: M.left - 5, x2: M.left, y1: yScale(t), y2: yScale(t) }));
    yAxis.appendChild(el('text', { x: M.left - 9, y: yScale(t) + 4, 'text-anchor': 'end' }, formatSci(t)));
  });
  svg.appendChild(yAxis);

  svg.appendChild(el('text', {
    x: M.left + W / 2, y: M.top + H + 42, 'text-anchor': 'middle', class: 'axis-label'
  }, 'mass   (Da)'));
  svg.appendChild(el('text', {
    x: 0, y: 0, 'text-anchor': 'middle', class: 'axis-label',
    transform: `translate(22, ${M.top + H/2}) rotate(-90)`
  }, 'Intensity'));

  const points = DATA.spectrum;
  let d = '', started = false;
  for (let i = 0; i < points.mz.length; i++) {
    const x = points.mz[i];
    if (x < xDomain[0] || x > xDomain[1]) continue;
    const px = xScale(x), py = yScale(points.intensity[i]);
    d += (started ? 'L' : 'M') + px.toFixed(2) + ' ' + py.toFixed(2) + ' ';
    started = true;
  }
  const dArea = d + `L${xScale(xDomain[1]).toFixed(2)} ${yScale(0).toFixed(2)} L${xScale(xDomain[0]).toFixed(2)} ${yScale(0).toFixed(2)} Z`;
  svg.appendChild(el('path', { d: dArea, fill: 'url(#trace-grad)', stroke: 'none' }));
  svg.appendChild(el('path', { d, fill: 'none', stroke: '#7cc4ff', 'stroke-width': 1, 'stroke-linejoin': 'round' }));

  const visible = ranked.filter(p => p.mz >= xDomain[0] && p.mz <= xDomain[1]);
  const LABEL_W = 144, LABEL_H = 56, ROW_GAP = 6;

  const items = visible.map(p => ({
    rank: p.rank, mz: p.mz, intensity: p.intensity,
    delta: p.delta, short: p.short, full: p.full,
    desiredX: xScale(p.mz),
    peakY: yScale(p.intensity),
    color: rankColor(p.rank)
  }));
  items.sort((a, b) => a.desiredX - b.desiredX);

  const rows = [];
  for (const it of items) {
    let placed = false;
    for (const row of rows) {
      const last = row[row.length - 1];
      if (it.desiredX - last.x >= LABEL_W + 6) {
        it.x = it.desiredX; it.row = rows.indexOf(row);
        row.push(it); placed = true; break;
      }
    }
    if (!placed) {
      it.x = it.desiredX; it.row = rows.length;
      rows.push([it]);
    }
  }
  for (const row of rows) {
    row[0].x = Math.max(row[0].x, M.left + LABEL_W/2 + 4);
    for (let i = 1; i < row.length; i++) {
      row[i].x = Math.max(row[i].x, row[i-1].x + LABEL_W + 6);
    }
    const last = row[row.length - 1];
    if (last.x > M.left + W - LABEL_W/2 - 4) {
      last.x = M.left + W - LABEL_W/2 - 4;
      for (let i = row.length - 2; i >= 0; i--) {
        if (row[i].x > row[i+1].x - LABEL_W - 6) row[i].x = row[i+1].x - LABEL_W - 6;
      }
    }
  }

  const nRows = rows.length;
  const rowYs = [];
  for (let r = 0; r < nRows; r++) {
    rowYs.push(M.top - 12 - (nRows - 1 - r) * (LABEL_H + ROW_GAP) - LABEL_H);
  }

  const leaderG = el('g');
  for (const it of items) {
    const labelBottomX = it.x;
    const labelBottomY = rowYs[it.row] + LABEL_H;
    const path = `M ${labelBottomX} ${labelBottomY} L ${labelBottomX} ${M.top - 4} L ${it.desiredX} ${it.peakY - 6}`;
    leaderG.appendChild(el('path', {
      d: path, stroke: it.color, 'stroke-width': 1, fill: 'none', 'stroke-opacity': 0.55
    }));
  }
  svg.appendChild(leaderG);

  const markerG = el('g');
  for (const it of items) {
    const g = el('g', { class: 'peak-marker' });
    g.appendChild(el('circle', { cx: it.desiredX, cy: it.peakY, r: 8, fill: it.color, 'fill-opacity': 0.18 }));
    g.appendChild(el('circle', { cx: it.desiredX, cy: it.peakY, r: 4, fill: it.color,
                                 stroke: '#0a0e15', 'stroke-width': 1.4 }));
    g.appendChild(el('line', { x1: it.desiredX, x2: it.desiredX, y1: it.peakY, y2: it.peakY - 4,
                               stroke: it.color, 'stroke-width': 1.5 }));
    g.addEventListener('mouseenter', e => showTip(e, it));
    g.addEventListener('mousemove', e => moveTip(e));
    g.addEventListener('mouseleave', hideTip);
    markerG.appendChild(g);
  }
  svg.appendChild(markerG);

  const labelG = el('g');
  for (const it of items) {
    const ly = rowYs[it.row];
    const g = el('g', { transform: `translate(${it.x - LABEL_W/2}, ${ly})` });

    g.appendChild(el('rect', {
      x: 0, y: 0, width: LABEL_W, height: LABEL_H, rx: 3,
      fill: '#0a0e15', stroke: it.color, 'stroke-width': 1.2
    }));

    g.appendChild(el('rect', {
      x: 6, y: 5, width: 20, height: 16, rx: 2, fill: it.color
    }));
    g.appendChild(el('text', {
      x: 16, y: 17, 'text-anchor': 'middle',
      'font-family': 'JetBrains Mono, monospace',
      'font-size': 11, 'font-weight': 700, fill: '#0a0e15'
    }, it.rank));

    g.appendChild(el('text', {
      x: 32, y: 17,
      'font-family': 'JetBrains Mono, monospace', 'font-size': 12,
      fill: '#e6edf3', 'font-weight': 500
    }, it.mz.toFixed(2)));

    const deltaTxt = it.rank === 1 ? 'base peak' :
                     (it.delta >= 0 ? '+' : '') + it.delta.toFixed(2) + ' Da';
    g.appendChild(el('text', {
      x: LABEL_W / 2, y: 33, 'text-anchor': 'middle',
      'font-family': 'JetBrains Mono, monospace', 'font-size': 10,
      fill: '#f9a826'
    }, deltaTxt));

    g.appendChild(el('text', {
      x: LABEL_W / 2, y: 49, 'text-anchor': 'middle',
      'font-family': 'Inter, sans-serif', 'font-size': 10.5,
      fill: '#cdd6e3', 'font-style': 'italic'
    }, it.short));

    labelG.appendChild(g);
  }
  svg.appendChild(labelG);

  svg.appendChild(el('g', { id: 'zoom-rect-g' }));
}

function niceTicks(min, max, n) {
  const range = max - min, rough = range / n;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1*mag; else if (norm < 3) step = 2*mag;
  else if (norm < 7) step = 5*mag; else step = 10*mag;
  const ticks = [];
  const start = Math.ceil(min / step) * step;
  for (let v = start; v <= max + 1e-9; v += step) ticks.push(v);
  return ticks;
}
function formatNum(v) {
  if (Math.abs(v) >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 0 });
  return v.toFixed(2);
}
function formatSci(v, digits = 1) {
  if (v === 0) return '0';
  const exp = Math.floor(Math.log10(Math.abs(v)));
  const mant = v / Math.pow(10, exp);
  return `${mant.toFixed(digits)}×10${supScript(exp)}`;
}
function supScript(n) {
  const map = { '-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹' };
  return String(n).split('').map(c => map[c] || c).join('');
}

function showTip(ev, l) {
  const deltaTxt = l.rank === 1 ? 'base peak' :
                   (l.delta >= 0 ? '+' : '') + l.delta.toFixed(2) + ' Da';
  tooltip.innerHTML = `
    <div class="t-rank" style="color:${l.color}">PEAK #${l.rank}</div>
    <div class="t-mz">m  &nbsp;&nbsp; ${l.mz.toFixed(3)} Da</div>
    <div class="t-int">int &nbsp; ${formatSci(l.intensity, 3)}</div>
    <div class="t-delta">Δm &nbsp; ${deltaTxt}</div>
    <div class="t-assign">${l.full}</div>`;
  tooltip.style.opacity = 1;
  moveTip(ev);
}
function moveTip(ev) {
  const rect = svg.getBoundingClientRect();
  tooltip.style.left = (ev.clientX - rect.left + 14) + 'px';
  tooltip.style.top = (ev.clientY - rect.top + 14) + 'px';
}
function hideTip() { tooltip.style.opacity = 0; }

let zoomStart = null, zoomRectEl = null;
svg.addEventListener('mousedown', e => {
  const pt = svgPoint(e);
  if (pt.x < M.left || pt.x > M.left + W || pt.y < M.top || pt.y > M.top + H) return;
  zoomStart = pt;
  const g = document.getElementById('zoom-rect-g');
  if (g) {
    while (g.firstChild) g.removeChild(g.firstChild);
    zoomRectEl = el('rect', { class: 'zoom-rect', x: pt.x, y: M.top, width: 0, height: H });
    g.appendChild(zoomRectEl);
  }
});
svg.addEventListener('mousemove', e => {
  if (!zoomStart) return;
  const pt = svgPoint(e);
  const x1 = Math.min(zoomStart.x, pt.x), x2 = Math.max(zoomStart.x, pt.x);
  zoomRectEl.setAttribute('x', x1); zoomRectEl.setAttribute('width', Math.max(1, x2 - x1));
});
svg.addEventListener('mouseup', e => {
  if (!zoomStart) return;
  const pt = svgPoint(e);
  const x1 = Math.min(zoomStart.x, pt.x), x2 = Math.max(zoomStart.x, pt.x);
  zoomStart = null;
  if (x2 - x1 > 8) {
    const v1 = ((x1 - M.left) / W) * (xDomain[1] - xDomain[0]) + xDomain[0];
    const v2 = ((x2 - M.left) / W) * (xDomain[1] - xDomain[0]) + xDomain[0];
    xDomain = [v1, v2]; render();
  } else {
    const g = document.getElementById('zoom-rect-g');
    if (g) while (g.firstChild) g.removeChild(g.firstChild);
  }
});
svg.addEventListener('mouseleave', () => {
  zoomStart = null;
  const g = document.getElementById('zoom-rect-g');
  if (g) while (g.firstChild) g.removeChild(g.firstChild);
});

function svgPoint(ev) {
  const rect = svg.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width * VBW;
  const y = (ev.clientY - rect.top) / rect.height * VBH;
  return { x, y };
}

document.getElementById('reset-zoom').addEventListener('click', () => {
  xDomain = [...DATA.mz_range_default]; render();
});
document.getElementById('show-all').addEventListener('click', () => {
  xDomain = [...DATA.mz_range_full]; render();
});

ranked.forEach(p => {
  const row = document.createElement('div');
  row.className = 'peak-row';
  const deltaTxt = p.rank === 1 ? 'base peak' :
                   (p.delta >= 0 ? '+' : '') + p.delta.toFixed(2) + ' Da';
  row.innerHTML = `
    <div class="rank" style="background:${rankColor(p.rank)}">${p.rank}</div>
    <div class="vals">
      <div class="top-line">
        <span>${p.mz.toFixed(2)} Da</span>
        <span class="delta">${deltaTxt}</span>
      </div>
      <div class="assign">${p.full}</div>
    </div>`;
  row.addEventListener('click', () => {
    xDomain = [p.mz - 60, p.mz + 60]; render();
  });
  legendEl.appendChild(row);
});

window.addEventListener('resize', render);
render();
</script>
</body>
</html>
